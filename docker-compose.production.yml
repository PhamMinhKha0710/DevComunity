version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SocialTechsy@2026" # CHANGE THIS IN PRODUCTION
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - socialtechsy-network

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - socialtechsy-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - socialtechsy-network

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest # CHANGE THIS
      RABBITMQ_DEFAULT_PASS: guest # CHANGE THIS
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - socialtechsy-network

  gitea:
    image: gitea/gitea:latest
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__server__ROOT_URL=http://localhost:3001/
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__DISABLE_SSH=true
    ports:
      - "3001:3000" # Mapped to 3001 to avoid conflict with frontend
    volumes:
      - gitea-data:/data
    networks:
      - socialtechsy-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=SocialTechsyDb;User Id=sa;Password=SocialTechsy@2026;TrustServerCertificate=True
      - Redis__ConnectionString=redis:6379
      - MongoDB__ConnectionString=mongodb://mongodb:27017
      - RabbitMQ__HostName=rabbitmq
      - JwtSettings__SecretKey=YourProductionSecretKeyAtLeast32CharsLong # CHANGE THIS
    ports:
      - "5122:8080"
    depends_on:
      - sqlserver
      - mongodb
      - redis
      - rabbitmq
    networks:
      - socialtechsy-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5122 # Or your public domain
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - socialtechsy-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - socialtechsy-network

networks:
  socialtechsy-network:
    driver: bridge

volumes:
  sqlserver-data:
  mongodb-data:
  redis-data:
  rabbitmq-data:
  gitea-data:
